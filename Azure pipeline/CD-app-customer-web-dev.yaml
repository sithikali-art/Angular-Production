# Deploy CI artifact to Azure App Service

trigger: none

pr: none



resources:
  pipelines:
    - pipeline: CI-app-customer-web
      source: CI-app-customer-web-dev
      trigger: true

pool:
  vmImage: windows-latest


variables:

  azureServiceConnection: 'uc10-dev-qa-serviceconnection'
  resourceGroupName: 'rg-uc10-dev'
  appServiceName: 'app-uc10-customerweb-dev'
  artifactName: 'drop'


stages:

- stage: Deploy_DEV
  displayName: 'DeployAppCustomerWeb to DEV'

  condition: succeeded()

  jobs:

  
  # DEPLOYMENT JOB
 

  - deployment: DeployAppCustomerWeb
    displayName: 'Deploy appcustomerweb to DEV App Service'

    environment: 'DEV'

    strategy:
      runOnce:
        deploy:

          steps:

          # # 1. Download artifact from CI pipeline

          # - download: CI-app-customer-web
          #   artifact: $(artifactName)

          # ==================================================
          # 1. DOWNLOAD CI ARTIFACT
          # ==================================================

          - task: DownloadPipelineArtifact@2
            displayName: 'Download CI Artifact'
            inputs:
              source: 'specific'
              project: '$(System.TeamProject)'
              definition: '$(resources.pipeline.customerWebCI.pipelineID)'
              buildVersionToDownload: 'specific'
              pipelineId: '$(resources.pipeline.customerWebCI.runID)'
              artifactName: 'drop'
              targetPath: '$(Pipeline.Workspace)\customerWebCI\drop'

          # 2. Display downloaded file
          - task: PowerShell@2
            displayName: 'Verify CI Artifact'
            inputs:
              targetType: 'inline'
              script: |

                Write-Host "=========================================="
                Write-Host "CI Pipeline"
                Write-Host "=========================================="

                Write-Host "Pipeline Name:"
                Write-Host "$(resources.pipeline.CI-app-customer-web.pipelineName)"

                Write-Host "CI Run ID:"
                Write-Host "$(resources.pipeline.CI-app-customer-web.runID)"

                Write-Host "Source Branch:"
                Write-Host "$(resources.pipeline.CI-app-customer-web.sourceBranch)"

                Write-Host "Source Commit:"
                Write-Host "$(resources.pipeline.CI-app-customer-web.sourceCommit)"

                Write-Host ""
                Write-Host "=========================================="
                Write-Host "Downloaded Artifact"
                Write-Host "=========================================="

                $artifactPath = "$(Pipeline.Workspace)\CI-app-customer-web\$(artifactName)"

                Write-Host "Artifact Path:"
                Write-Host $artifactPath

                if (!(Test-Path $artifactPath)) {
                    Write-Error "Artifact directory does not exist."
                    exit 1
                }

                Get-ChildItem `
                    -Path $artifactPath `
                    -Recurse |
                    Select-Object FullName

          # --------------------------------------------------
          # 3. Deploy folder to Windows App Service
          #
          # Web Deploy synchronizes the files/folders.
          #
          # TakeAppOfflineFlag:
          #   1. Creates app_offline.htm
          #   2. Stops application from serving requests
          #   3. Deploys files
          #   4. Removes app_offline.htm
          #   5. Application starts again
          # --------------------------------------------------

          - task: AzureRmWebAppDeployment@5
            displayName: 'Deploy CI-app-customer-web Files to App Service'
            inputs:

              ConnectionType: 'AzureRM'

              azureSubscription: '$(azureServiceConnection)'

              appType: 'webApp'

              WebAppName: '$(appServiceName)'

              ResourceGroupName: '$(resourceGroupName)'

              # IMPORTANT:
              # This is the extracted artifact folder.
              # No Docker image / ACR deployment.
              Package: '$(Pipeline.Workspace)\CI-app-customer-web\$(artifactName)'

              # Use Web Deploy for Windows App Service
              enableCustomDeployment: true
              DeploymentType: 'webDeploy'

              # Take application offline during deployment
              TakeAppOfflineFlag: true

              # Do not delete files that are not part of this deployment
              RemoveAdditionalFilesFlag: false

              # Don't modify App_Data
              ExcludeFilesFromAppDataFlag: true

          # --------------------------------------------------
          # 4. Verify App Service is running
          # --------------------------------------------------

          - task: AzureCLI@2
            displayName: 'Verify App Service Status'
            inputs:

              azureSubscription: '$(azureServiceConnection)'

              scriptType: 'ps'

              scriptLocation: 'inlineScript'

              inlineScript: |

                Write-Host "Checking App Service status..."

                $state = az webapp show `
                  --resource-group "$(resourceGroupName)" `
                  --name "$(appServiceName)" `
                  --query "state" `
                  --output tsv

                Write-Host "App Service State: $state"

                if ($state -ne "Running") {

                    Write-Error "App Service is not running."

                    exit 1
                }

                Write-Host ""
                Write-Host "=========================================="
                Write-Host "Deployment completed successfully"
                Write-Host "=========================================="

                Write-Host "App Service : $(appServiceName)"
                Write-Host "Resource RG : $(resourceGroupName)"
                Write-Host "CI Pipeline : $(resources.pipeline.CI-app-customer-web.pipelineName)"
                Write-Host "CI Run ID   : $(resources.pipeline.CI-app-customer-web.runID)"
                Write-Host "State       : $state"

        
          # 5. Deployment summary
          - task: PowerShell@2
            displayName: 'Deployment Summary'
            inputs:
              targetType: 'inline'
              script: |

                Write-Host ""
                Write-Host "=========================================="
                Write-Host " CUSTOMER WEB DEV DEPLOYMENT"
                Write-Host "=========================================="

                Write-Host "Application : $(appServiceName)"
                Write-Host "Environment : DEV"
                Write-Host "Artifact    : $(artifactName)"
                Write-Host "CI Run ID   : $(resources.pipeline.CI-app-customer-web.runID)"

                Write-Host ""
                Write-Host "Deployment completed."