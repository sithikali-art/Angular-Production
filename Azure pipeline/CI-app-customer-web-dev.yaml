# app-customer-web-Build-pipelines

trigger:
  - dev

pool:
  vmImage: windows-latest

stages:
- stage: Build
  displayName: "Build Node.js"

  jobs:
  - job: Build
    displayName: "Install node"

    steps:

    # ==========================================
    # INSTALL NODE.JS
    # ==========================================
    - task: UseNode@1
      displayName: 'Install Node.js'
      inputs:
        version: '22.x'


    # ==========================================
    # INSTALL NPM DEPENDENCIES
    # ==========================================
    - script: npm ci
      displayName: 'Install npm ci dependencies'


    # ==========================================
    # CREATE SNYK REPORT DIRECTORY
    # ==========================================
    - powershell: |
        $reportDir = "$(Build.ArtifactStagingDirectory)\snyk-reports"

        New-Item -ItemType Directory -Force -Path $reportDir | Out-Null

        Write-Host "Snyk report directory created:"
        Write-Host $reportDir
      displayName: 'Create Snyk Report Directory'


    # ==========================================
    # SNYK APP / OPEN SOURCE SCAN
    # ==========================================
    - task: SnykSecurityScan@1
      displayName: 'Snyk App Scan'
      inputs:
        serviceConnectionEndpoint: 'uc9-synk-sc-accesstoken-UC10'
        testType: 'app'

        # Update Snyk website for every run
        monitorWhen: 'always'

        # Report all vulnerabilities
        severityThreshold: 'low'

        # Fail pipeline only for High and above
        failOnIssues: false
        failOnThreshold: 'high'

        organization: 'xtrm-inc.-default'

        # Save Snyk result as JSON
        additionalArguments: '--json-file-output=$(Build.ArtifactStagingDirectory)\snyk-reports\snyk-app-report.json'


    # ==========================================
    # SNYK CODE SCAN
    # ==========================================
    - task: SnykSecurityScan@1
      displayName: 'Snyk Code Scan'
      inputs:
        serviceConnectionEndpoint: 'uc9-synk-sc-accesstoken-UC10'
        testType: 'code'

        # Report High and above
        codeSeverityThreshold: 'high'

        # Fail pipeline when High issues are found
        failOnIssues: true
        failOnThreshold: 'high'

        organization: 'xtrm-inc.-default'

        # Save Snyk Code result as JSON
        additionalArguments: '--json-file-output=$(Build.ArtifactStagingDirectory)\snyk-reports\snyk-code-report.json'


    # ==========================================
    # INSTALL SNYK-TO-HTML
    # ==========================================
    - powershell: |
        npm install -g snyk-to-html
      displayName: 'Install Snyk HTML Report Tool'
      condition: always()


    # ==========================================
    # CONVERT APP JSON REPORT TO HTML
    # ==========================================
    - powershell: |
        $reportDir = "$(Build.ArtifactStagingDirectory)\snyk-reports"
        $jsonFile = "$reportDir\snyk-app-report.json"
        $htmlFile = "$reportDir\snyk-app-report.html"

        if (Test-Path $jsonFile) {

          Write-Host "Generating Snyk App HTML report..."

          snyk-to-html `
            -i $jsonFile `
            -o $htmlFile

        }
        else {
          Write-Host "Snyk App JSON report was not found."
        }
      displayName: 'Generate Snyk App HTML Report'
      condition: always()


    # ==========================================
    # CONVERT CODE JSON REPORT TO HTML
    # ==========================================
    - powershell: |
        $reportDir = "$(Build.ArtifactStagingDirectory)\snyk-reports"
        $jsonFile = "$reportDir\snyk-code-report.json"
        $htmlFile = "$reportDir\snyk-code-report.html"

        if (Test-Path $jsonFile) {

          Write-Host "Generating Snyk Code HTML report..."

          snyk-to-html `
            -i $jsonFile `
            -o $htmlFile

        }
        else {
          Write-Host "Snyk Code JSON report was not found."
        }
      displayName: 'Generate Snyk Code HTML Report'
      condition: always()


    # ==========================================
    # PUBLISH SNYK REPORTS
    # ==========================================
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Snyk Reports'
      condition: always()
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)\snyk-reports'
        ArtifactName: 'snyk-reports'
        publishLocation: 'Container'


    # ==========================================
    # BUILD APPLICATION
    # ==========================================
    - task: Npm@1
      displayName: 'Build application'
      inputs:
        command: 'custom'
        workingDir: '$(System.DefaultWorkingDirectory)'
        customCommand: 'run build'


    # ==========================================
    # COPY APPLICATION FILES
    # ==========================================
    - task: CopyFiles@2
      displayName: 'Copy application files'
      inputs:
        SourceFolder: '$(System.DefaultWorkingDirectory)/dist/xtrm-dashboard'
        Contents: '**'
        TargetFolder: '$(Build.ArtifactStagingDirectory)/application'


    # ==========================================
    # PUBLISH APPLICATION ARTIFACT
    # ==========================================
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Application Artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/application'
        ArtifactName: 'drop'
        publishLocation: 'Container'

    