# app-customer-web-Build-pipelines

trigger:
  - dev
        

pool:
  vmImage: windows-latest

# pool:
#   name: Windows 11_Devrg01
#   demands:
#     - Agent.Name -equals Agent-40.78.177.228



stages:
- stage: Build
  displayName: "Build Node.js"
  jobs:
  - job: Build
    displayName: "Install node"
    steps:



    - task: UseNode@1
      displayName: 'Install Node.js'
      inputs:
        version: '22.x'

    - script: npm ci
      displayName: 'Install npm ci dependencies'

    - task: SnykSecurityScan@1
      displayName: snyk test app scan
      inputs:
        serviceConnectionEndpoint: 'uc9-synk-sc-accesstoken-UC10'
        testType: 'app'
        monitorWhen: 'always'
        failOnIssues: false
        organization: 'xtrm-inc.-default'
        failOnThreshold: 'high'
        

    - task: SnykSecurityScan@1
      displayName: snyk test code scan
      inputs:
        serviceConnectionEndpoint: 'uc9-synk-sc-accesstoken-UC10'
        testType: 'code'
        monitorWhen: 'always'
        failOnIssues: true
        organization: 'xtrm-inc.-default'
        failOnThreshold: 'high'

    - powershell: |
        npm install -g snyk snyk-to-html
      displayName: 'Install Snyk CLI and Report Tool'
      condition: always()


    - powershell: |
        $reportDir = "$(Build.ArtifactStagingDirectory)\snyk-reports"

        New-Item -ItemType Directory -Force -Path $reportDir

        Write-Host "Snyk report directory:"
        Write-Host $reportDir
      displayName: 'Create Snyk Report Directory'
      condition: always()


    - powershell: |
        $reportDir = "$(Build.ArtifactStagingDirectory)\snyk-reports"

        snyk test `
          --severity-threshold=high `
          --json-file-output="$reportDir\snyk-app-report.json"

        $exitCode = $LASTEXITCODE

        Write-Host "Snyk App Scan Exit Code: $exitCode"

        if (Test-Path "$reportDir\snyk-app-report.json") {
          snyk-to-html `
            -i "$reportDir\snyk-app-report.json" `
            -o "$reportDir\snyk-app-report.html"
        }

        exit 0
      displayName: 'Generate Snyk App Report'
      condition: always()


    - powershell: |
        $reportDir = "$(Build.ArtifactStagingDirectory)\snyk-reports"

        snyk code test `
          --severity-threshold=high `
          --json-file-output="$reportDir\snyk-code-report.json"

        $exitCode = $LASTEXITCODE

        Write-Host "Snyk Code Scan Exit Code: $exitCode"

        if (Test-Path "$reportDir\snyk-code-report.json") {
          snyk-to-html `
            -i "$reportDir\snyk-code-report.json" `
            -o "$reportDir\snyk-code-report.html"
        }

        exit 0
      displayName: 'Generate Snyk Code Report'
      condition: always()


    - task: PublishBuildArtifacts@1
      displayName: 'Publish Snyk Reports'
      condition: always()
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)\app-customer-web\snyk-reports'
        ArtifactName: 'snyk-reports'
        publishLocation: 'Container'


    - task: Npm@1
      inputs:
        command: 'custom'
        workingDir: '$(System.DefaultWorkingDirectory)'
        customCommand: 'run build'

    - task: CopyFiles@2
      inputs:
        SourceFolder: '$(System.DefaultWorkingDirectory)/dist/xtrm-dashboard'
        Contents: '**'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)\app-customer-web'
        ArtifactName: 'drop'
        publishLocation: 'Container'

    