<!doctype html>
<html lang="en" data-palette="aurora">
  <head>
    <meta charset="utf-8" />
    <title>Xtrm — Fintech Dashboard</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="images/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Initial app-load screen: shown until Angular bootstraps, then
         replaced by the app. Same rotating-square spinner as the
         in-app route loader. */
      .boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
      }
      .boot-loader span {
        width: 46px;
        height: 46px;
        border: 5px solid #635bff;
        border-radius: 10px;
        animation: boot-spin 1.05s cubic-bezier(0.65, 0.05, 0.35, 1) infinite;
      }
      @keyframes boot-spin {
        0% { transform: rotate(0deg) scale(1); }
        40% { transform: rotate(90deg) scale(0.86); }
        50% { transform: rotate(90deg) scale(0.86); }
        90% { transform: rotate(180deg) scale(1); }
        100% { transform: rotate(180deg) scale(1); }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="boot-loader"><span></span></div>
    </app-root>
  </body>
</html>
