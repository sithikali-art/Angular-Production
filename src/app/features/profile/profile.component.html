<h1>User Profile</h1>

<div class="card profile-card">
  <div class="d-flex align-items-center gap-3 flex-wrap profile-head">
    <app-avatar [name]="user.name" [size]="64" />
    <div class="d-flex flex-column">
      <span class="profile-title">{{ user.name }}</span>
      <span class="profile-sub">{{ user.email }} · {{ user.role }}</span>
    </div>
    <button type="button" class="btn btn-soft ms-auto">
      <app-icon name="settings" [size]="15" />
      Edit profile
    </button>
  </div>

  <hr class="my-4" />

  <div class="row g-4">
    @for (row of details; track row.label) {
      <div class="col-12 col-sm-6 col-lg-4">
        <div class="d-flex align-items-center gap-3">
          <span class="detail-icon">
            <app-icon [name]="row.icon" [size]="17" />
          </span>
          <div class="d-flex flex-column">
            <span class="detail-label">{{ row.label }}</span>
            <span class="detail-value">{{ row.value }}</span>
          </div>
        </div>
      </div>
    }
  </div>

  <hr class="my-4" />

  <div class="d-flex align-items-center gap-3 flex-wrap">
    <span class="detail-icon">
      <app-icon name="shield" [size]="17" />
    </span>
    <div class="d-flex flex-column">
      <span class="detail-label">Two-factor authentication</span>
      <span class="detail-value text-positive">Enabled</span>
    </div>
    <button type="button" class="btn btn-ghost ms-auto">Manage security</button>
  </div>
</div>
