<div class="page-head">
  <div class="company">
    <div class="company-row">
      <h1>{{ company.name }}</h1>
      <!-- Image 6: status popover -->
      <app-status-popover />
    </div>
    <div class="spn">
      {{ company.spn }}
      <app-icon name="copy" [size]="13" />
    </div>
  </div>

  <!-- Images 7 & 8: opens the approvals slide-over (shared button + badge) -->
  <app-button
    btnVariant="soft"
    btnClass="rounded-pill"
    icon="clipboard-check"
    btnText="Approvals Outstanding"
    (click)="openApprovals()"
  >
    <app-badge badgeType="number" [badgeText]="'' + approvals.pendingCount()" badgeVariant="primary" />
    <app-icon name="arrow-right" [size]="14" />
  </app-button>
</div>

<div class="hero-grid">
  <!-- Images 1 & 9: balance card + wallet switcher -->
  <app-wallet-balance-card />
  <app-recent-activity />
</div>

<!-- Image 10: funding bank account bar -->
<app-funding-bar />

<!-- Image 1: stats + credits/debits chart -->
<app-activity-chart />
