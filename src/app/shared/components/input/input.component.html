<div class="app-input-container">
  @if (label()) {
    <label class="form-label fs-7 fw-medium text-secondary mb-1">
      {{ label() }}
      @if (required()) {
        <span class="text-danger">*</span>
      }
    </label>
  }

  <div
    class="custom-input-wrapper d-flex align-items-center gap-2"
    [class.variant-hero]="variant() === 'hero'"
    [class.variant-standard]="variant() === 'standard'"
    [class.variant-outlined]="variant() === 'outlined'"
    [class.text-end-align]="textAlign() === 'right'"
  >
    <!-- Main Input Field -->
    <input
      [type]="type()"
      class="form-control border-0 p-0 flex-grow-1 shadow-none"
      [class.text-end]="textAlign() === 'right'"
      [placeholder]="placeholder()"
      [value]="value()"
      [disabled]="disabled()"
      [required]="required()"
      (input)="onInput($event)"
    />

    <!-- Suffix / Currency Code Badge -->
    @if (suffix()) {
      <span class="suffix-badge flex-shrink-0 fw-medium">
        {{ suffix() }}
      </span>
    }

    <!-- Integrated Action Button -->
    @if (actionText()) {
      <app-button
        [btnText]="actionText()"
        btnVariant="soft"
        btnClass="rounded-pill px-3 py-1 fs-7 border-0 flex-shrink-0 bg-white text-secondary shadow-xs text-nowrap"
        (click)="actionClick.emit()"
      />
    }
  </div>
</div>
