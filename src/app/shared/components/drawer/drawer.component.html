    <div class="backdrop" (click)="closed.emit()"></div>
    <aside class="panel scrollbar-soft" role="dialog" aria-modal="true" [attr.aria-label]="title()">
      <header class="panel-head">
        <div class="panel-title">
          @if (icon()) {
            <span class="panel-icon"><app-icon [name]="icon()!" [size]="18" /></span>
          }
          <div>
            <h2>{{ title() }}</h2>
            @if (subtitle()) {
              <p>{{ subtitle() }}</p>
            }
          </div>
        </div>
        <button class="icon-btn" type="button" aria-label="Close" (click)="closed.emit()">
          <app-icon name="x" [size]="18" />
        </button>
      </header>
      <div class="panel-body scrollbar-soft">
        <ng-content />
      </div>
      <footer class="panel-foot">
        <ng-content select="[drawer-footer]" />
      </footer>
    </aside>
