@if (previewStyle(); as forced) {
  <span [class]="'pa style-' + forced" [style.width.px]="size()" [style.height.px]="size()">
    @if (forced === 'smiley') {
      <svg viewBox="0 0 36 36" aria-hidden="true">
        <circle cx="13" cy="15" r="1.8" fill="#fff" />
        <circle cx="23" cy="15" r="1.8" fill="#fff" />
        <path d="M11.5 21.5c2 2.6 4.4 3.9 6.5 3.9s4.5-1.3 6.5-3.9" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" />
      </svg>
    }
  </span>
} @else {
  @if (account.avatar(); as avatar) {
    @if (avatar.kind === 'photo') {
      <span class="pa pa-photo" [style.width.px]="size()" [style.height.px]="size()">
        <img [src]="avatar.dataUrl" alt="Profile photo" />
      </span>
    } @else {
      <span [class]="'pa style-' + avatar.style" [style.width.px]="size()" [style.height.px]="size()">
        @if (avatar.style === 'smiley') {
          <svg viewBox="0 0 36 36" aria-hidden="true">
            <circle cx="13" cy="15" r="1.8" fill="#fff" />
            <circle cx="23" cy="15" r="1.8" fill="#fff" />
            <path d="M11.5 21.5c2 2.6 4.4 3.9 6.5 3.9s4.5-1.3 6.5-3.9" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" />
          </svg>
        }
      </span>
    }
  }
  @if (editable()) {
    <button type="button" class="edit-badge" aria-label="Edit profile picture" (click)="edit.emit(); $event.stopPropagation()">
      <app-icon name="pencil" [size]="12" />
    </button>
  }
}
