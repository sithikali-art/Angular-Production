<div class="otp-container">
  <label class="otp-label mb-3">Verification code</label>
  
  <div class="d-flex justify-content-between gap-2 mb-3" (paste)="onPaste($event)">
    @for (i of slots; track i) {
      <input
        #otpInput
        type="text"
        inputmode="numeric"
        maxlength="1"
        class="form-control otp-box text-center border-0"
        [value]="otpValues()[i] || ''"
        (input)="onInput($event, i)"
        (keydown)="onKeyDown($event, i)"
      />
    }
  </div>

  <div class="text-center mb-4">
    <button type="button" class="btn btn-link text-decoration-none resend-btn p-0" (click)="resend.emit()">
      Resend code
    </button>
  </div>

  <div class="d-flex align-items-center justify-content-between gap-3 pt-2">
    <button type="button" class="btn btn-link text-decoration-none text-dark d-inline-flex align-items-center gap-2 p-0 fw-semibold" (click)="back.emit()">
      <span>&larr;</span> Back
    </button>
    <button
      type="button"
      class="btn verify-btn rounded-pill px-4 py-2 flex-grow-1"
      [disabled]="otpValues().join('').length < length()"
      (click)="completed.emit(otpValues().join(''))"
    >
      Verify and continue
    </button>
  </div>
</div>
